name: CI

# Quality gates for pull requests and the default branch. Deployment is handled by
# Vercel's native Git integration (connect the repo in the Vercel dashboard) — this
# workflow only gates correctness, it does not deploy. Protect the default branch with
# a required status check on this workflow so production deploys are effectively gated.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    name: typecheck · model · trace · smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck (strict, no `any`)
        run: npm run typecheck

      - name: Verify configured model ids are current
        run: npm run check:model

      - name: Trace projection contract (P4 UI)
        run: npx tsx scripts/verify-trace.ts

      - name: Loop smoke test — allow + block must hit expected gate outcomes
        run: npm run demo
        env:
          # Force the deterministic offline stub: no API key in CI, and the run must
          # not depend on one. Asserts allowed→allow and blocked→block.
          AGENTS_OFFLINE: "1"

  governed-trader-example:
    # The examples/governed-trader package applies this repo's gate to the canonical
    # irreversible action — a trade. Zero-dependency, CPU-only Node: no install, no
    # network, no API key. Gated here so the example provably stays green.
    name: example · governed-trader (self-tests + eval)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/governed-trader
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Self-tests — gate · conductor · audit · equities (61 assertions)
        run: npm test

      - name: Eval — reproduce the governance + honesty claims on frozen crypto + equities data
        run: node eval/run_eval.js
