<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 440" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Governed Agents architecture: Researcher to Reasoner to Governance gate, which allows, blocks, or routes for approval; every step streams as an NDJSON trace event to the UI.">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8" />
    </marker>
    <style>
      .box { fill:#ffffff; stroke:#cbd5e1; stroke-width:1.5; rx:10; }
      .title { font-size:13px; font-weight:700; fill:#0f172a; }
      .sub { font-size:11px; fill:#64748b; }
      .edge { stroke:#94a3b8; stroke-width:1.6; fill:none; }
      .lbl { font-size:11px; font-weight:600; }
    </style>
  </defs>

  <rect x="0" y="0" width="940" height="440" fill="#f8fafc" />
  <text x="32" y="40" font-size="18" font-weight="700" fill="#0f172a">Governed Agents — pre-execution policy gate</text>
  <text x="32" y="62" class="sub">Agents propose actions; the gate allows / blocks / routes for approval before anything runs.</text>

  <!-- POST /api/run -->
  <rect x="32" y="96" width="120" height="44" rx="10" fill="#0f172a" />
  <text x="92" y="118" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">POST</text>
  <text x="92" y="133" text-anchor="middle" font-size="11" fill="#cbd5e1">/api/run</text>

  <!-- Researcher -->
  <rect x="190" y="92" width="150" height="56" rx="10" class="box" />
  <text x="265" y="116" text-anchor="middle" class="title">Researcher</text>
  <text x="265" y="134" text-anchor="middle" class="sub">retrieve + summarize</text>

  <!-- Reasoner -->
  <rect x="370" y="92" width="150" height="56" rx="10" class="box" />
  <text x="445" y="116" text-anchor="middle" class="title">Reasoner</text>
  <text x="445" y="134" text-anchor="middle" class="sub">propose ONE action</text>

  <!-- Gate -->
  <rect x="550" y="88" width="150" height="64" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="2" />
  <text x="625" y="114" text-anchor="middle" class="title">Governance gate</text>
  <text x="625" y="132" text-anchor="middle" class="sub">evaluatePolicy()</text>

  <!-- edges through the pipeline -->
  <path class="edge" d="M 152 118 L 188 118" marker-end="url(#arrow)" />
  <path class="edge" d="M 340 120 L 368 120" marker-end="url(#arrow)" />
  <path class="edge" d="M 520 120 L 548 120" marker-end="url(#arrow)" />

  <!-- Outcomes -->
  <rect x="752" y="44" width="158" height="50" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="1.6" />
  <text x="770" y="66" class="lbl" fill="#047857">✓ allow</text>
  <text x="770" y="83" class="sub" fill="#065f46">→ Executor runs</text>

  <rect x="752" y="106" width="158" height="50" rx="10" fill="#fef2f2" stroke="#ef4444" stroke-width="1.6" />
  <text x="770" y="128" class="lbl" fill="#b91c1c">✕ block</text>
  <text x="770" y="145" class="sub" fill="#991b1b">→ Halt (never runs)</text>

  <rect x="752" y="168" width="158" height="50" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.6" />
  <text x="770" y="190" class="lbl" fill="#b45309">⏸ needs approval</text>
  <text x="770" y="207" class="sub" fill="#92400e">→ Hold for a human</text>

  <!-- branch edges from gate -->
  <path class="edge" d="M 700 112 C 726 90, 730 72, 750 69" marker-end="url(#arrow)" />
  <path class="edge" d="M 700 122 L 750 131" marker-end="url(#arrow)" />
  <path class="edge" d="M 700 132 C 726 156, 730 176, 750 193" marker-end="url(#arrow)" />

  <!-- provenance note -->
  <text x="445" y="172" text-anchor="middle" class="sub">carries scored provenance (0–1) — grounded in retrieval, not the model</text>

  <!-- stream band -->
  <rect x="32" y="250" width="878" height="150" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />
  <text x="52" y="280" class="title" font-size="13">Every step streams as one NDJSON TraceEvent</text>
  <text x="52" y="300" class="sub">run_started · step_* · action_proposed · gate_decision · executed | halted | awaiting_approval · run_completed</text>

  <path class="edge" d="M 625 152 L 625 250" stroke-dasharray="4 4" marker-end="url(#arrow)" />

  <rect x="52" y="320" width="250" height="60" rx="10" fill="#f1f5f9" stroke="#cbd5e1" />
  <text x="177" y="345" text-anchor="middle" class="lbl" fill="#334155">incremental parse + validate</text>
  <text x="177" y="363" text-anchor="middle" class="sub">lib/ndjson.ts (malformed lines skipped)</text>

  <rect x="330" y="320" width="250" height="60" rx="10" fill="#f1f5f9" stroke="#cbd5e1" />
  <text x="455" y="345" text-anchor="middle" class="lbl" fill="#334155">pure projection → nodes/edges</text>
  <text x="455" y="363" text-anchor="middle" class="sub">lib/trace-model.ts (no React, no logic)</text>

  <rect x="608" y="320" width="250" height="60" rx="10" fill="#f1f5f9" stroke="#cbd5e1" />
  <text x="733" y="345" text-anchor="middle" class="lbl" fill="#334155">React Flow graph + audit panels</text>
  <text x="733" y="363" text-anchor="middle" class="sub">gate decision · provenance · policies</text>

  <path class="edge" d="M 302 350 L 328 350" marker-end="url(#arrow)" />
  <path class="edge" d="M 580 350 L 606 350" marker-end="url(#arrow)" />
</svg>
